name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # scripts/ship-mail.sh — симлинк на канон в dotfiles (SSOT транспорта).
      # В CI цель симлинка не существует → материализуем два линт-инструмента
      # канона по их публичному пути (fail-closed guard иначе не пустит тесты).
      - name: Materialize ship-mail canon tools (symlink target)
        run: |
          CANON=/home/rudra/dotfiles/tools/ship-mail
          sudo mkdir -p "$CANON"
          for tool in lint_letter.py mandate_number.py; do
            curl -fsSL "https://raw.githubusercontent.com/atmavichara108/dotfiles/main/tools/ship-mail/$tool" -o "$CANON/$tool"
          done
          ls -la "$CANON"
      - run: npm run test
      - run: npm run build
