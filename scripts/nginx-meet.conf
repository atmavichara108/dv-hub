# Nginx config for MiroTalk SFU (meet.re-search.wiki)
# Reference config — actual server config managed via certbot (DV-027).
#
# Install: sudo cp scripts/nginx-meet.conf /etc/nginx/sites-available/meet.re-search.wiki
#          sudo ln -s /etc/nginx/sites-available/meet.re-search.wiki /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Note: SSL certificates are managed by certbot (Let's Encrypt).
# If certbot already configured this vhost, only the proxy_pass block
# inside the location / needs to match this file.

server {
    listen 80;
    server_name meet.re-search.wiki;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name meet.re-search.wiki;

    ssl_certificate /etc/letsencrypt/live/re-search.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/re-search.wiki/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
